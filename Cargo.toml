[package]
name = "vaultgrim"
version = "1.0.0"
edition = "2021"
authors = ["Vaultgrim Team"]
description = "🔐 Industry-standard terminal encryption tool with Post-Quantum resistance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vaultgrim/vaultgrim"
keywords = ["cryptography", "encryption", "cli", "security", "post-quantum", "vaultgrim"]
categories = ["command-line-utilities", "cryptography"]

[features]
default = []
pqc = ["oqs"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Cryptography - Symmetric
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Cryptography - Asymmetric
curve25519-dalek = { version = "4.0", features = ["rand_core"] }
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pem", "pkcs8", "signature", "std"] }
rsa = { version = "0.9", features = ["pem"] }

# Key Derivation
argon2 = "0.5"

# Post-Quantum (using liboqs bindings) - requires libclang to build
oqs = { version = "0.7", optional = true }

# Hashing
sha2 = "0.10"
blake2 = "0.10"
hmac = "0.12"

# Random
rand = "0.8"
rand_core = "0.6"

# File operations
walkdir = "2.5"
filedescriptor = "0.8"
fs2 = "0.4"  # for file locking
tar = "0.4"
flate2 = "0.2"

# Utilities
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

# UI
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.10"
rand = "0.8"
hex = "0.4"
